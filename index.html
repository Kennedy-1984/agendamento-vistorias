<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terceira Visão Vistorias — Agendamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B2229; --surface:#242D35; --surface2:#2E3944; --surface3:#38434F;
    --border:#455160; --text:#F2F1EC; --text-dim:#9FB0BC;
    --accent:#C41532; --accent-dark:#9C0F27; --accent2:#E8546B;
    --success:#3FA34D; --danger:#C41532; --info:#4C9AFF; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:0.04em;font-weight:700;margin:0 0 8px;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .app{max-width:1100px;margin:0 auto;padding:0 16px 60px;}
  .topbar{background:var(--surface);border-bottom:3px solid var(--accent);padding:18px 16px;margin-bottom:20px;}
  .topbar-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-badge{width:44px;height:44px;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .brand-badge img{width:100%;height:100%;object-fit:contain;}
  .brand h1{font-size:22px;margin:0;letter-spacing:0.02em;}
  .brand span{display:block;font-size:11px;color:var(--text-dim);text-transform:none;font-family:'Inter';letter-spacing:0;}
  nav.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  nav.tabs button{background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:9px 14px;border-radius:999px;cursor:pointer;font-family:'Inter';font-size:13px;font-weight:600;transition:.15s;}
  nav.tabs button:hover{border-color:var(--accent);color:var(--text);}
  nav.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .internal-link{font-size:11px;color:var(--text-dim);opacity:.6;cursor:pointer;margin-left:6px;text-decoration:underline;}
  .internal-link:hover{opacity:1;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
  .card h2{font-size:20px;color:var(--accent);}
  .muted{color:var(--text-dim);font-size:13px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .col{flex:1;min-width:220px;}
  label{display:block;font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
  input[type=text],input[type=date],input[type=time],input[type=number],input[type=password],select,textarea{
    width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:7px;font-family:'Inter';font-size:14px;margin-bottom:14px;
  }
  input[type=date]::-webkit-calendar-picker-indicator {
    transform: scale(1.3);
    cursor: pointer;
    filter: invert(1);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  textarea{min-height:70px;resize:vertical;}
  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:none;padding:11px 18px;border-radius:7px;font-weight:700;font-size:14px;cursor:pointer;font-family:'Inter';transition:.15s;}
  .btn:hover{background:var(--accent-dark);}
  .btn.secondary{background:var(--surface3);color:var(--text);border:1px solid var(--border);}
  .btn.secondary:hover{border-color:var(--accent);}
  .btn.danger{background:var(--danger);color:#fff;}
  .btn.success{background:var(--success);color:#fff;}
  .btn.small{padding:6px 12px;font-size:12px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .pill.cautelar{background:#2E4B6B;color:#BFE0FF;}
  .pill.transferencia{background:#4B3A1F;color:#FFD79A;}
  .pill.ok{background:#1F4B2E;color:#9CE6B0;}
  .pill.cancel{background:#4B1F1F;color:#FFB0B0;}
  .steps{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .step{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);font-weight:600;}
  .step .dot{width:22px;height:22px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono';font-size:11px;}
  .step.active .dot{background:var(--accent);color:#fff;border-color:var(--accent);}
  .step.done .dot{background:var(--success);color:#fff;border-color:var(--success);}
  .step.active{color:var(--text);}
  .slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin:14px 0;}
  .slot{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:12px 6px;border-radius:7px;text-align:center;cursor:pointer;font-family:'IBM Plex Mono';font-size:14px;font-weight:600;transition:.12s;}
  .slot:hover{border-color:var(--accent);transform:translateY(-1px);}
  .slot.selected{background:var(--accent);border-color:var(--accent);color:#fff;}
  .slot.taken{background:transparent;color:#4a5459;border-style:dashed;cursor:not-allowed;text-decoration:line-through;}
  .ticket{position:relative;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin:16px 0;overflow:hidden;}
  .ticket::before{content:"";position:absolute;top:0;bottom:0;left:0;width:8px;background:repeating-linear-gradient(180deg,var(--accent) 0 8px,transparent 8px 16px);}
  .ticket-stamp{position:absolute;top:16px;right:20px;border:3px solid var(--success);color:var(--success);padding:4px 12px;border-radius:6px;font-family:'Barlow Condensed';font-weight:800;font-size:18px;transform:rotate(8deg);letter-spacing:.05em;}
  .ticket-stamp.cancel-stamp{border-color:var(--danger);color:var(--danger);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);}
  th{color:var(--text-dim);text-transform:uppercase;font-size:11px;letter-spacing:.03em;}
  tr:hover td{background:var(--surface2);}
  .empty{text-align:center;padding:36px 16px;color:var(--text-dim);}
  .empty .big{font-size:38px;margin-bottom:6px;}
  .banner{padding:12px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;border:1px solid;}
  .banner.info{background:#132436;border-color:var(--info);color:#BFE0FF;}
  .banner.warn{background:#332512;border-color:var(--accent);color:#FFDA9E;}
  .banner.error{background:#3a1a1a;border-color:var(--danger);color:#FFC0C0;}
  .subtabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:12px;}
  .subtabs button{background:none;border:none;color:var(--text-dim);padding:6px 10px;cursor:pointer;font-weight:600;font-size:13px;border-radius:6px;}
  .subtabs button.active{background:var(--surface3);color:var(--accent);}
  .list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap;}
  .stat{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:14px;flex:1;min-width:140px;}
  .stat .num{font-family:'Barlow Condensed';font-size:30px;font-weight:800;color:var(--accent);line-height:1;}
  .stat .lbl{font-size:11px;color:var(--text-dim);text-transform:uppercase;margin-top:4px;}
  .file-drop{border:2px dashed var(--border);border-radius:8px;padding:16px;text-align:center;font-size:13px;color:var(--text-dim);cursor:pointer;margin-bottom:14px;}
  a.linklike{color:var(--accent);cursor:pointer;text-decoration:underline;font-size:13px;}
  .detail-box{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:14px;margin:8px 0;}
</style>
</head>

        <h1>Terceira Visão Vistorias</h1>

<script>
/* ADAPTADOR DE ARMAZENAMENTO VERCEL / STORAGE LOCAL */
window.storage = {
  async get(key){
    const res = await fetch('/api/storage?key='+encodeURIComponent(key));
    if(!res.ok) throw new Error(await extractErrorMessage(res, 'ler '+key));
    const data = await res.json();
    if(data.value === null || data.value === undefined) return null;
    return { key, value: data.value };
  },
  async set(key, value){
    const res = await fetch('/api/storage', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ op:'set', key, value })
    });
    if(!res.ok) throw new Error(await extractErrorMessage(res, 'salvar '+key));
    return { key, value };
  },
  async delete(key){
    const res = await fetch('/api/storage', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ op:'delete', key })
    });
    if(!res.ok) throw new Error(await extractErrorMessage(res, 'excluir '+key));
    return { key, deleted:true };
  }
};
async function extractErrorMessage(res, acao){
  try{
    const data = await res.json();
    if(data && data.error) return 'Falha ao '+acao+' — '+data.error;
  }catch(e){}
  return 'Falha ao '+acao+' (código '+res.status+')';
}

/* HELPER REGRA: TOLERÂNCIA DE ATRASO DO CLIENTE (20 MINUTOS) */
function isWithinTolerance(dateStr, timeStr) {
  const scheduled = new Date(`${dateStr}T${timeStr}:00`);
  const now = new Date();
  const diffMins = (now - scheduled) / (1000 * 60);
  return diffMins <= 20;
}

/* COMPONENTE DE SELEÇÃO E UPLOAD DE ANEXOS / LAUDOS (PADRONIZADO) */
const ANEXO_MAX_ARQUIVOS = 6;
const ANEXO_MAX_TOTAL_BYTES = 20*1024*1024; // 20MB acumulados
const ANEXO_ACCEPT = '.pdf,.doc,.docx,image/jpeg,image/png';

function buildAnexosPickerGenerico(existingMeta, novosArr, onAdded){
  const wrap = el(`<div></div>`);
  function totalBytes(){
    const dosExistentes = existingMeta.reduce((soma,f)=>soma+(f.size||0),0);
    const dosNovos = novosArr.reduce((soma,f)=>soma+(f.size||0),0);
    return dosExistentes + dosNovos;
  }
  const totalQtd = ()=> existingMeta.length + novosArr.length;
  const infoLine = el(`<p class="muted"></p>`);
  function atualizarInfo(){
    const mb = (totalBytes()/1024/1024).toFixed(1);
    infoLine.textContent = `${totalQtd()}/${ANEXO_MAX_ARQUIVOS} arquivos · ${mb}MB de 20MB usados — PDF, JPG, PNG, DOC ou DOCX`;
  }
  wrap.appendChild(infoLine);
  const listBox = el(`<div></div>`);
  wrap.appendChild(listBox);
  function renderLista(){
    listBox.innerHTML='';
    novosArr.forEach((f,idx)=>{
      const chip = el(`<div class="list-item" style="padding:5px 0"><span class="muted">📎 ${f.name}</span></div>`);
      const rm = el(`<button class="btn danger small">Remover</button>`);
      rm.onclick = ()=>{ novosArr.splice(idx,1); renderLista(); atualizarInfo(); rebuildDrop(); if(onAdded) onAdded(); };
      chip.appendChild(rm);
      listBox.appendChild(chip);
    });
    atualizarInfo();
  }
  const dropSlot = el(`<div></div>`);
  wrap.appendChild(dropSlot);
  function rebuildDrop(){
    dropSlot.innerHTML='';
    if(totalQtd() >= ANEXO_MAX_ARQUIVOS) return;
    const drop = el(`<div class="file-drop">Clique para anexar um arquivo/laudo</div>`);
    const hidden = el(`<input type="file" accept="${ANEXO_ACCEPT}" style="display:none">`);
    drop.onclick = ()=> hidden.click();
    hidden.onchange = ()=>{
      const f = hidden.files[0]; if(!f) return;
      if(totalQtd() >= ANEXO_MAX_ARQUIVOS){ alert('Máximo de '+ANEXO_MAX_ARQUIVOS+' arquivos por agendamento.'); return; }
      if(totalBytes() + f.size > ANEXO_MAX_TOTAL_BYTES){ alert('Limite global de 20MB excedido.'); return; }
      const reader = new FileReader();
      reader.onload = ()=>{
        novosArr.push({name:f.name, mime:f.type, dataUrl:reader.result, size:f.size});
        renderLista(); rebuildDrop(); if(onAdded) onAdded();
      };
      reader.readAsDataURL(f);
    };
    dropSlot.appendChild(drop);
    dropSlot.appendChild(hidden);
  }
  renderLista();
  rebuildDrop();
  return wrap;
}

/* RENDERIZADOR DE RELATÓRIOS (GESTOR / SUPERVISOR / GERENTE) */
function renderRelatoriosGerais() {
  const card = el(`<div class="card"><h2>Relatórios de Agendamentos e Produção</h2></div>`);
  
  // Agrupamentos
  let totalAgendados = 0;
  let totalReagendados = 0;
  let totalCancelados = 0;
  
  const porVistoriador = {};
  const porVendedor = {};
  const porConcessionaria = {};

  state.appointments.forEach(a => {
    if (a.status === 'confirmado') totalAgendados++;
    if (a.status === 'reagendado') totalReagendados++;
    if (a.status === 'cancelado') totalCancelados++;

    const vNome = inspectorName(a.inspectorId);
    porVistoriador[vNome] = (porVistoriador[vNome] || 0) + 1;

    const sNome = sellerName(a.sellerId);
    porVendedor[sNome] = (porVendedor[sNome] || 0) + 1;

    const dNome = dealershipName(a.dealershipId);
    porConcessionaria[dNome] = (porConcessionaria[dNome] || 0) + 1;
  });

  const statsRow = el(`<div class="row" style="margin-bottom:20px">
    <div class="stat"><div class="num">${totalAgendados}</div><div class="lbl">Agendados</div></div>
    <div class="stat"><div class="num">${totalReagendados}</div><div class="lbl">Reagendados</div></div>
    <div class="stat"><div class="num">${totalCancelados}</div><div class="lbl">Cancelados</div></div>
  </div>`);
  card.appendChild(statsRow);

  function makeTable(title, obj) {
    let html = `<h3>${title}</h3><table><thead><tr><th>Nome / Entidade</th><th>Total de Vistorias</th></tr></thead><tbody>`;
    for (const [k, v] of Object.entries(obj)) {
      html += `<tr><td>${k}</td><td><b>${v}</b></td></tr>`;
    }
    html += `</tbody></table><br>`;
    return el(html);
  }

  card.appendChild(makeTable('Produção por Vistoriador', porVistoriador));
  card.appendChild(makeTable('Agendamentos por Vendedor', porVendedor));
  card.appendChild(makeTable('Agendamentos por Concessionária', porConcessionaria));

  return card;
}
</script>
